name: PaperForge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

jobs:
  # =========================================================
  # 1. BACKEND QUALITY ASSURANCE & TESTING
  # =========================================================
  backend-qa:
    name: Backend QA & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest-cov

      - name: Run Pytest Test Suite & Generate Coverage
        working-directory: ./server
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=app --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload Pytest Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-coverage-report
          path: |
            server/coverage.xml
            server/pytest-report.xml
          retention-days: 14

      - name: Upload Coverage to Codecov (Optional)
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./server/coverage.xml
          fail_ci_if_error: false

  # =========================================================
  # 2. FRONTEND QUALITY ASSURANCE & BUILD
  # =========================================================
  frontend-qa:
    name: Frontend QA & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint / Oxlint
        working-directory: ./client
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: ./client
        run: npm run type-check

      - name: Build Production React Bundle
        working-directory: ./client
        run: npm run build

      - name: Upload Frontend Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist
          retention-days: 14

  # =========================================================
  # 3. DOCKER IMAGE BUILD & COMPOSE VALIDATION
  # =========================================================
  docker-qa:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Client Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client.Dockerfile
          push: false
          tags: paperforge-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: false
          tags: paperforge-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Environment File for Compose Validation
        run: cp .env.example .env

      - name: Validate Docker Compose (Dev Profile)
        run: docker compose --profile dev config

      - name: Validate Docker Compose (Prod Profile)
        run: docker compose --profile prod config

  # =========================================================
  # 4. SECURITY SCANNING & ADVISORIES
  # =========================================================
  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Python Dependencies (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r server/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Node Dependencies (npm audit)
        working-directory: ./client
        continue-on-error: true
        run: |
          npm audit --audit-level=high

  # =========================================================
  # 5. DEPENDENCY REVIEW (PULL REQUESTS ONLY)
  # =========================================================
  dependency-review:
    name: PR Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review Action
        uses: actions/dependency-review-action@v5
        continue-on-error: true
