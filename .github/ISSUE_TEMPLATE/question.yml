name: ❓ Question & Support
description: Ask a question about PaperForge setup, configuration, or usage
title: "[QUESTION]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about deploying, configuring, or using PaperForge? Ask away!

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know or clarify?
      placeholder: How do I configure...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any relevant environment details (OS, Docker version, Python version, etc.).
